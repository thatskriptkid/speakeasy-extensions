name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: python -m py_compile patches/patch_speakeasy.py tools/*.py

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t speakeasy-extensions:test .
